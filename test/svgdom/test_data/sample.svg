<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 5 7.5" width="50%" height="50%" version="1.1" id="root"><title>Title for rectangles</title><desc>Four separate rectangles</desc><!-- Comment for parsing --><rect id="red" x="0.5" y="0.5" width="2" height="1" fill="red" transform="rotate(10)"/><rect id="oval1" x="0.5" y="2" rx=".5" width="1" height="1.5" transform="skewX(10)"/><rect id="blue" x="3" y="0.5" width="1.5" height="2" stroke="blue" stroke-width=".2" transform="skewY(5)"/><rect id="oval2" x="3.5" y="3" ry=".25" width="1" height="0.5"  transform="translate(-.1,.3)"/><rect id="scale" x="0.5" y="3.5" width="1" height="1"  fill="green" stroke="blue" stroke-width=".1" transform="scale(.5, 1.5)"/><rect id="multiple" x="0.5" y="3.5" width="1" height="1"  fill="yellow" stroke="blue" stroke-width=".1" transform="scale(.5, 3) translate(3,-2.25) rotate(10) skewX(7) skewY(-12)"/><!-- Show outline of viewport using 'rect' element --><rect id="outline" x="0.01" y="0.01" width="4.98" height="7.48" rx=".2" ry=".5" fill="none" stroke="blue" stroke-width=".02"/></svg>